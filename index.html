<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rubin Observatory Optical Sensitivity Model</title>
  <script src="https://unpkg.com/deck.gl@9.1.13/dist.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-columns: minmax(760px, 50vw) 1fr; font-family: system-ui, sans-serif; }
    #ui  { position: relative; z-index: 10; padding: 12px; border-right: 1px solid #ddd; background: #fff; overflow: auto; }
    #vis {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f14;
    }
    #vis canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    .row { display: grid; grid-template-columns: 135px 1fr 72px; gap: 6px; align-items: center; margin: 3px 0; }
    .row label { white-space: nowrap; font-size: 11px; }
    .row span { text-align: right; font-family: ui-monospace, Menlo, monospace; }
    .row input[type="range"] { margin: 0; width: 100%; min-width: 0; }
    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .slider-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
    .control-column { min-width: 0; }
    .control-title { font-size: 12px; font-weight: 600; margin: 4px 0 8px; }
    .vmode-diag {
      margin-top: 12px;
      border-top: 1px solid #e4e4e4;
      padding-top: 8px;
      display: grid;
      gap: 8px;
    }
    .vmode-tab-header {
      display: flex;
      gap: 6px;
    }
    .vmode-tab-btn {
      border: 1px solid #bbb;
      background: #f7f7f7;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .vmode-tab-btn.is-active {
      background: #e9f2ff;
      border-color: #9cb6df;
      font-weight: 600;
    }
    .vmode-tab-panel { display: none; }
    .vmode-tab-panel.is-active { display: grid; gap: 8px; }
    .vmode-diag-title {
      font-size: 11px;
      font-weight: 600;
      color: #333;
    }
    .vmode-diag-canvas {
      width: 100%;
      height: 120px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      display: block;
    }
    .vmode-coeff-text {
      width: 100%;
      min-height: 252px;
      box-sizing: border-box;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px;
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      background: #fff;
      color: #222;
    }
    .btn { border: 1px solid #bbb; background: #f7f7f7; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .text-input {
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      min-width: 120px;
    }
    .number-input {
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      width: 72px;
    }
    .control-config {
      display: grid;
      grid-template-columns: 58px 1fr 44px auto auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .control-config label { white-space: nowrap; }
    .control-hint {
      font-size: 11px;
      color: #555;
      margin: -4px 0 10px;
    }
    .row.is-inactive {
      opacity: 0.42;
    }
    .axis-labels {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 5;
      color: #d7e7ff;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      pointer-events: none;
      opacity: 0.85;
      line-height: 1.2;
    }
    .mouse-coords {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 5;
      color: #d7e7ff;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      pointer-events: none;
      opacity: 0.9;
    }
    .scale-bar {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 5;
      color: #d7e7ff;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      opacity: 0.9;
    }
    .scale-bar-line {
      height: 0;
      border-top: 2px solid #d7e7ff;
      width: 24px;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 15, 20, 0.82);
      color: #e5edf8;
      font-family: ui-monospace, Menlo, monospace;
      pointer-events: none;
    }
    .loading-panel {
      width: min(420px, calc(100% - 48px));
      display: grid;
      gap: 8px;
    }
    .loading-title {
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .loading-track {
      height: 8px;
      border: 1px solid rgba(229, 237, 248, 0.35);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
    }
    .loading-fill {
      height: 100%;
      width: 0%;
      background: #7ab2ff;
      transition: width 100ms linear;
    }
    .loading-text {
      font-size: 11px;
      opacity: 0.92;
    }
    .is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div style="font-weight:600; margin-bottom:6px;">Rubin Observatory Optical Sensitivity Model</div>
    <div class="controls">
      <button id="reset-controls" class="btn" type="button" disabled>Loading…</button>
    </div>
    <div class="control-config">
      <label for="use-dof-input">use_dof</label>
      <input id="use-dof-input" class="text-input" type="text" value="0-9,10-16,30-34" spellcheck="false" />
      <label for="nkeep-input">nkeep</label>
      <input id="nkeep-input" class="number-input" type="number" min="1" step="1" value="12" />
      <button id="apply-modes" class="btn" type="button" disabled>Apply</button>
    </div>
    <div class="control-hint">use_dof format: <span>0-9,10-16,30-34</span>. Change inputs, then click Apply (or press Enter).</div>
    <div class="slider-columns">
      <div class="control-column">
        <div class="control-title">Original controls</div>
        <div id="sliders"></div>
      </div>
      <div class="control-column">
        <div class="control-title">Linear combinations</div>
        <div id="combo-sliders"></div>
        <div class="vmode-diag">
          <div class="vmode-tab-header">
            <button id="vmode-tab-plots" class="vmode-tab-btn is-active" type="button">Plots</button>
            <button id="vmode-tab-coeff" class="vmode-tab-btn" type="button">Coefficients</button>
          </div>
          <div id="vmode-panel-plots" class="vmode-tab-panel is-active">
            <div class="vmode-diag-title">Mode matrix (Vhᵀ)</div>
            <canvas id="vmode-matrix-canvas" class="vmode-diag-canvas" aria-hidden="true"></canvas>
            <div class="vmode-diag-title">Singular values</div>
            <canvas id="vmode-spectrum-canvas" class="vmode-diag-canvas" aria-hidden="true"></canvas>
          </div>
          <div id="vmode-panel-coeff" class="vmode-tab-panel">
            <div class="vmode-diag-title">Mode coefficients (CSV)</div>
            <textarea id="vmode-coeff-output" class="vmode-coeff-text" readonly spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="vis">
    <canvas id="grid-canvas" aria-hidden="true"></canvas>
    <canvas id="deck-canvas"></canvas>
    <div id="loading-overlay" class="loading-overlay" aria-live="polite">
      <div class="loading-panel">
        <div class="loading-title">Loading model data…</div>
        <div class="loading-track"><div id="loading-fill" class="loading-fill"></div></div>
        <div id="loading-text" class="loading-text">Starting download…</div>
      </div>
    </div>
    <div class="axis-labels" aria-hidden="true">y ↑<br>x →</div>
    <div id="mouse-coords" class="mouse-coords" aria-hidden="true">x: ---, y: ---</div>
    <div class="scale-bar" aria-hidden="true">
      <div id="scale-bar-line" class="scale-bar-line"></div>
      <div>1 arcsec</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
